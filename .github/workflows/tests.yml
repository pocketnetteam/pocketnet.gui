name: PR Tests

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:

  # Offline tests: mock proxy, no network
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, mbstring
      - name: Run tests
        run: npm test

  # Real production proxy used by link previews. Fails when the proxy is down, not only on code bugs.
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, mbstring
      - name: Run live tests
        run: npm run test:live
